# Firebase App Hosting backend config
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 3
  minInstances: 0
  concurrency: 80

env:
  # ─── Firebase Client SDK (BUILD + RUNTIME) ─────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: san-fedele-dev.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: san-fedele-dev
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: san-fedele-dev.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # ─── Firebase Admin SDK ────────────────────────────────────────
  # In produzione usiamo Application Default Credentials (ADC): il backend
  # App Hosting gira con il SA firebase-app-hosting-compute che ha i ruoli
  # Cloud Datastore User + Firebase Admin SDK Administrator Service Agent.
  # Nessuna service account key serve qui. La key nel .env.local locale
  # viene usata solo in sviluppo (vedi lib/firebase/admin.ts).
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: san-fedele-dev
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: san-fedele-dev.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # ─── Email per nodemailer (RUNTIME only) ───────────────────────
  - variable: EMAIL_HOST
    secret: EMAIL_HOST
    availability:
      - RUNTIME

  - variable: EMAIL_PORT
    secret: EMAIL_PORT
    availability:
      - RUNTIME

  - variable: EMAIL_USER
    secret: EMAIL_USER
    availability:
      - RUNTIME

  - variable: EMAIL_PASS
    secret: EMAIL_PASS
    availability:
      - RUNTIME

  - variable: EMAIL_TO
    secret: EMAIL_TO
    availability:
      - RUNTIME
