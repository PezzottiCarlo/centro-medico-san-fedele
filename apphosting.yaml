# Firebase App Hosting backend config
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 3
  minInstances: 0
  concurrency: 80

env:
  # ─── Firebase Client SDK (BUILD + RUNTIME) ─────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: san-fedele-dev.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: san-fedele-dev
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: san-fedele-dev.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # ─── Firebase Admin SDK ────────────────────────────────────────
  # In produzione usiamo Application Default Credentials (ADC): il backend
  # App Hosting gira con il SA firebase-app-hosting-compute che ha i ruoli
  # Cloud Datastore User + Firebase Admin SDK Administrator Service Agent.
  # Nessuna service account key serve qui. La key nel .env.local locale
  # viene usata solo in sviluppo (vedi lib/firebase/admin.ts).
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: san-fedele-dev
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: san-fedele-dev.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # ─── Chatbot — Gemini via Vertex AI (RUNTIME only) ─────────────
  # Nessun secret: il backend chiama Vertex AI con le Application Default
  # Credentials del SA firebase-app-hosting-compute (ruolo "Vertex AI User").
  # Vertex AI va abilitato da Firebase Console > Build > AI Logic.
  - variable: GCLOUD_PROJECT
    value: san-fedele-dev
    availability:
      - RUNTIME

  # 'global' = endpoint multiregionale, ha sempre i modelli più nuovi.
  # Per data-residency UE: europe-west4.
  - variable: VERTEX_LOCATION
    value: global
    availability:
      - RUNTIME

  # Alias che punta sempre all'ultimo Flash disponibile.
  - variable: VERTEX_MODEL
    value: gemini-flash-latest
    availability:
      - RUNTIME

  # ─── reCAPTCHA v3 (anti-spam sui moduli) ───────────────────────
  # La site key NON è un segreto: viene compilata dentro il bundle del client e
  # si legge nel sorgente di ogni pagina con un modulo. Tenerla come `value`
  # evita un secret da gestire a build time senza togliere nulla alla sicurezza
  # — a proteggere è la secret key, che resta solo lato server.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdH6botAAAAAMqLXK6Ea5RuKqiKF48lAAalN2v_
    availability:
      - BUILD
      - RUNTIME

  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability:
      - RUNTIME

  # ─── Email per nodemailer (RUNTIME only) ───────────────────────
  - variable: EMAIL_HOST
    secret: EMAIL_HOST
    availability:
      - RUNTIME

  - variable: EMAIL_PORT
    secret: EMAIL_PORT
    availability:
      - RUNTIME

  - variable: EMAIL_USER
    secret: EMAIL_USER
    availability:
      - RUNTIME

  - variable: EMAIL_PASS
    secret: EMAIL_PASS
    availability:
      - RUNTIME

  - variable: EMAIL_TO
    secret: EMAIL_TO
    availability:
      - RUNTIME

  # ─── Recensioni Google (RUNTIME only) ──────────────────────────
  # Voto, totale e ultime recensioni della scheda Google del centro
  # (lib/reviews.ts). La chiave resta un secret, solo lato server.
  - variable: GOOGLE_PLACES_API_KEY
    secret: GOOGLE_PLACES_API_KEY
    availability:
      - RUNTIME

  # L'ID della scheda Google del centro non è un segreto
  - variable: GOOGLE_PLACE_ID
    value: ChIJgQik4WGghkcRiUorySo28zA
    availability:
      - RUNTIME
